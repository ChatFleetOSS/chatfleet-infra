name: Infra CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  packages: read

jobs:
  validate-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate stable image references
        run: |
          eval "$(CHANNEL=stable bash ./scripts/resolve-channel.sh)"
          python3 ./scripts/promote_channel.py \
            --channel stable \
            --api-tag "${API_TAG}" \
            --web-tag "${WEB_TAG}" \
            --verify-only
      - name: Exercise promotion flow across three versions
        run: python3 ./scripts/test_promotion_flow.py
      - name: Installer legacy upgrade regression tests
        run: |
          bash -n install.sh upgrade.sh
          python3 ./scripts/test_install_dir_resolution.py
          python3 ./scripts/test_mongo_uri_repair.py
          python3 ./scripts/test_legacy_upgrade_compat.py

  smoke-stable:
    runs-on: ubuntu-latest
    needs: validate-stable
    steps:
      - uses: actions/checkout@v4
      - name: Resolve stable channel
        run: |
          eval "$(CHANNEL=stable bash ./scripts/resolve-channel.sh)"
          echo "API_TAG=${API_TAG}" >> "$GITHUB_ENV"
          echo "WEB_TAG=${WEB_TAG}" >> "$GITHUB_ENV"
      - name: Install stack from current checkout
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/chatfleet-infra" \
          INFRA_SOURCE_DIR="$GITHUB_WORKSPACE" \
          CHANNEL=stable \
          CREATE_ADMIN=1 \
          ADMIN_EMAIL=admin@example.com \
          bash ./install.sh
      - name: Verify running versions
        run: |
          python3 "$RUNNER_TEMP/chatfleet-infra/scripts/verify_stack.py" \
            --base-url http://localhost:8080 \
            --expected-api "$API_TAG" \
            --expected-web "$WEB_TAG"
      - name: Publish verified client install command
        run: |
          {
            echo "## Stable installer verified"
            echo
            echo "The public client command now resolves to:"
            echo
            echo '```bash'
            echo 'curl -fsSL "https://raw.githubusercontent.com/ChatFleetOSS/chatfleet-infra/main/install.sh?$(date +%s)" | bash'
            echo '```'
            echo
            echo "- API: \`${API_TAG}\`"
            echo "- Web: \`${WEB_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f "$RUNNER_TEMP/chatfleet-infra/docker-compose.yml" logs --tail=200
      - name: Cleanup
        if: always()
        run: docker compose -f "$RUNNER_TEMP/chatfleet-infra/docker-compose.yml" down -v || true

  smoke-stable-upgrade:
    runs-on: ubuntu-latest
    needs: validate-stable
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve previous and proposed stable channels
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          git show "origin/${{ github.base_ref }}:channels/stable.env" > "$RUNNER_TEMP/previous-stable.env"

          eval "$(CHANNEL=stable bash ./scripts/resolve-channel.sh)"
          echo "API_TAG=${API_TAG}" >> "$GITHUB_ENV"
          echo "WEB_TAG=${WEB_TAG}" >> "$GITHUB_ENV"

          PREVIOUS_API_TAG="$(sed -n 's/^API_TAG=//p' "$RUNNER_TEMP/previous-stable.env" | tail -n1)"
          PREVIOUS_WEB_TAG="$(sed -n 's/^WEB_TAG=//p' "$RUNNER_TEMP/previous-stable.env" | tail -n1)"
          if [ -z "$PREVIOUS_API_TAG" ] || [ -z "$PREVIOUS_WEB_TAG" ]; then
            echo "::error title=Invalid previous stable channel::Could not read API_TAG/WEB_TAG from base branch stable.env"
            exit 1
          fi
          echo "PREVIOUS_API_TAG=${PREVIOUS_API_TAG}" >> "$GITHUB_ENV"
          echo "PREVIOUS_WEB_TAG=${PREVIOUS_WEB_TAG}" >> "$GITHUB_ENV"

          echo "previous=${PREVIOUS_API_TAG}/${PREVIOUS_WEB_TAG}"
          echo "proposed=${API_TAG}/${WEB_TAG}"
      - name: Install previous stable then upgrade to proposed stable
        run: |
          set -euo pipefail
          if [ "$PREVIOUS_API_TAG" = "$API_TAG" ] && [ "$PREVIOUS_WEB_TAG" = "$WEB_TAG" ]; then
            echo "Stable channel did not change; upgrade recreation smoke is not needed."
            exit 0
          fi

          INSTALL_DIR="$RUNNER_TEMP/chatfleet-infra-upgrade" \
          INFRA_SOURCE_DIR="$GITHUB_WORKSPACE" \
          CHANNEL=stable \
          API_TAG="$PREVIOUS_API_TAG" \
          WEB_TAG="$PREVIOUS_WEB_TAG" \
          bash ./install.sh

          compose_file="$RUNNER_TEMP/chatfleet-infra-upgrade/docker-compose.yml"
          before_api_id="$(docker compose -f "$compose_file" ps -q api)"
          before_web_id="$(docker compose -f "$compose_file" ps -q web)"
          before_api_image="$(docker inspect "$before_api_id" --format '{{.Config.Image}}')"
          before_web_image="$(docker inspect "$before_web_id" --format '{{.Config.Image}}')"

          CHANNEL=stable \
          API_TAG="$API_TAG" \
          WEB_TAG="$WEB_TAG" \
          "$RUNNER_TEMP/chatfleet-infra-upgrade/upgrade.sh" "$RUNNER_TEMP/chatfleet-infra-upgrade"

          after_api_id="$(docker compose -f "$compose_file" ps -q api)"
          after_web_id="$(docker compose -f "$compose_file" ps -q web)"
          after_api_image="$(docker inspect "$after_api_id" --format '{{.Config.Image}}')"
          after_web_image="$(docker inspect "$after_web_id" --format '{{.Config.Image}}')"

          echo "before_api_id=${before_api_id} image=${before_api_image}"
          echo "after_api_id=${after_api_id} image=${after_api_image}"
          echo "before_web_id=${before_web_id} image=${before_web_image}"
          echo "after_web_id=${after_web_id} image=${after_web_image}"

          python3 "$RUNNER_TEMP/chatfleet-infra-upgrade/scripts/verify_stack.py" \
            --base-url http://localhost:8080 \
            --expected-api "$API_TAG" \
            --expected-web "$WEB_TAG"

          if [ "$PREVIOUS_API_TAG" != "$API_TAG" ] && [ "$before_api_id" = "$after_api_id" ]; then
            echo "::error title=API container was not recreated::API_TAG changed from $PREVIOUS_API_TAG to $API_TAG but the api container id stayed $after_api_id"
            exit 1
          fi
          if [ "$PREVIOUS_WEB_TAG" != "$WEB_TAG" ] && [ "$before_web_id" = "$after_web_id" ]; then
            echo "::error title=Web container was not recreated::WEB_TAG changed from $PREVIOUS_WEB_TAG to $WEB_TAG but the web container id stayed $after_web_id"
            exit 1
          fi
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f "$RUNNER_TEMP/chatfleet-infra-upgrade/docker-compose.yml" logs --tail=200 || true
      - name: Cleanup
        if: always()
        run: docker compose -f "$RUNNER_TEMP/chatfleet-infra-upgrade/docker-compose.yml" down -v || true

  validate-edge:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate edge image references
        run: |
          eval "$(CHANNEL=edge bash ./scripts/resolve-channel.sh)"
          python3 ./scripts/promote_channel.py \
            --channel edge \
            --api-tag "${API_TAG}" \
            --web-tag "${WEB_TAG}" \
            --verify-only

  smoke-edge:
    runs-on: ubuntu-latest
    needs: validate-edge
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve edge channel
        run: |
          eval "$(CHANNEL=edge bash ./scripts/resolve-channel.sh)"
          echo "API_TAG=${API_TAG}" >> "$GITHUB_ENV"
          echo "WEB_TAG=${WEB_TAG}" >> "$GITHUB_ENV"
      - name: Install stack from current checkout
        run: |
          set -euo pipefail
          INSTALL_DIR="$RUNNER_TEMP/chatfleet-infra-edge" \
          INFRA_SOURCE_DIR="$GITHUB_WORKSPACE" \
          CHANNEL=edge \
          bash ./install.sh
      - name: Verify running versions
        run: |
          python3 "$RUNNER_TEMP/chatfleet-infra-edge/scripts/verify_stack.py" \
            --base-url http://localhost:8080 \
            --expected-api-prefix sha- \
            --expected-web-prefix sha-
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f "$RUNNER_TEMP/chatfleet-infra-edge/docker-compose.yml" logs --tail=200
      - name: Cleanup
        if: always()
        run: docker compose -f "$RUNNER_TEMP/chatfleet-infra-edge/docker-compose.yml" down -v || true
